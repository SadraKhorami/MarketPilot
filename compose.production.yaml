# Use explicitly with -f. Never merge this file with the local-infrastructure compose.yaml.
name: ${COMPOSE_PROJECT_NAME:?Set an isolated staging/production project name}
x-app: &app
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: [/bin/sh, /usr/local/bin/marketpilot-redis.sh]
    secrets: [redis_password]
    volumes:
      - redis-data:/data
      - ./docker/redis-entrypoint.sh:/usr/local/bin/marketpilot-redis.sh:ro
    tmpfs: [/run/marketpilot:size=1m,mode=0700]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    <<: *app
    restart: "no"
    profiles: [tools]
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    env_file: ["${MIGRATION_ENV_FILE:?Set MIGRATION_ENV_FILE outside the build context}"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    env_file: ["${API_ENV_FILE:?Set API_ENV_FILE outside the build context}"]
    environment: { NODE_ENV: production, API_HOST: 0.0.0.0, API_PORT: "4000" }
    ports: ["127.0.0.1:${API_BIND_PORT:-8081}:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    env_file: ["${WORKER_ENV_FILE:?Set WORKER_ENV_FILE outside the build context}"]
    environment: { NODE_ENV: production, WORKER_HEALTH_HOST: 0.0.0.0, WORKER_HEALTH_PORT: "4100" }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    <<: *app
    # Next image optimization/cache needs a writable, disposable cache; product data stays in Postgres.
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777, /srv/apps/web/.next/cache:uid=1000,gid=1000,size=128m]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the stable public HTTPS API URL including /api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the stable public HTTPS dashboard origin}
    ports: ["127.0.0.1:${WEB_BIND_PORT:-8080}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE outside the repository}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set REDIS_PASSWORD_FILE outside the repository}
